apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: phoenix
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'vllm'
              scrape_interval: 10s
              metrics_path: '/metrics'
              static_configs:
                - targets: ['vllm-service.vllm.svc.cluster.local:8000']
    
    exporters:
      debug:
        verbosity: basic
    
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [debug]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.100.0
          command:
            - "/otelcol"
            - "--config=/etc/otelcol/config.yaml"
          ports:
            - containerPort: 4317
              name: otlp
            - containerPort: 8888
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
