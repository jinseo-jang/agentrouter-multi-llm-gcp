apiVersion: v1
kind: ServiceAccount
metadata:
  name: epp-sa
  namespace: vllm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: epp-clusterrole
rules:
- apiGroups: [""]
  resources: ["pods", "pods/status", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["inference.networking.k8s.io"]
  resources: ["inferencepools", "inferencepools/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: epp-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: epp-clusterrole
subjects:
- kind: ServiceAccount
  name: epp-sa
  namespace: vllm
